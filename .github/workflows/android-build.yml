name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # The repository ships gradle-wrapper.properties and launcher scripts. If the binary
      # gradle-wrapper.jar is not present, generate the official wrapper (Gradle 8.7) here.
      - name: Set up Gradle (only to generate a missing wrapper jar)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper if missing
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: |
          echo "gradle-wrapper.jar not found - generating official wrapper for Gradle 8.7"
          mkdir -p /tmp/wrapgen
          (cd /tmp/wrapgen && touch settings.gradle && gradle wrapper --gradle-version 8.7 --distribution-type bin)
          mkdir -p gradle/wrapper
          cp /tmp/wrapgen/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          cp /tmp/wrapgen/gradlew gradlew
          cp /tmp/wrapgen/gradlew.bat gradlew.bat

      - name: Validate Gradle wrapper
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Show Gradle and Java versions
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            exit 1
          fi
          ls -l "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MIC-FX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and build reports (kept even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
